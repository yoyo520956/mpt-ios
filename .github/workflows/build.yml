name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Forensics: AVFoundation SDK 布局 + ObjC 对照
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          echo "=== SDK 根目录 ==="
          ls -la "$SDK" | head -15
          echo "=== SDKSettings ==="
          cat "$SDK/SDKSettings.plist" 2>/dev/null | head -20 || echo "(无)"
          H="$SDK/System/Library/Frameworks/AVFoundation.framework/Headers"
          echo "=== Headers 文件数 ==="
          ls "$H" | wc -l
          echo "=== AVComposition.h 行数 / 是否截断 ==="
          wc -l "$H/AVComposition.h" 2>/dev/null || echo "(不存在)"
          echo "--- head 30 ---"
          head -30 "$H/AVComposition.h" 2>/dev/null
          echo "--- @interface 列表 ---"
          grep -n "@interface\|@property.*Tracks\|videoTracks" "$H/AVComposition.h" 2>/dev/null | head -20
          echo "=== AVAssetTrack.h 行数 / duration 声明 ==="
          wc -l "$H/AVAssetTrack.h" 2>/dev/null
          grep -n "duration" "$H/AVAssetTrack.h" 2>/dev/null | head -10
          echo "=== 全 framework 内 videoTracks 出现处 ==="
          grep -rln "videoTracks" "$SDK/System/Library/Frameworks/AVFoundation.framework/" 2>/dev/null | head -10
          echo "=== 是否存在 swiftmodule / swiftinterface ==="
          find "$SDK" -maxdepth 4 -name "AVFoundation*" 2>/dev/null | head -20
          ls "$SDK/usr/lib" 2>/dev/null | head
          TC="/Applications/Xcode_16.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain"
          ls "$TC/usr/lib/swift" 2>/dev/null | wc -l
          ls "$TC/usr/lib/swift" 2>/dev/null | grep -i "avf\|coremedia\|avfaudio" | head
          echo "=== ObjC 层对照编译 ==="
          cat > /tmp/t.m <<'EOF'
          #import <AVFoundation/AVFoundation.h>
          void t(void) {
              AVMutableComposition *c = [[AVMutableComposition alloc] init];
              NSArray *vt = c.videoTracks;
              AVMutableAudioMix *m = [[AVMutableAudioMix alloc] init];
              NSArray *in = m.inputs;
              AVMutableAudioMixInputTrack *a = [[AVMutableAudioMixInputTrack alloc] init];
              AVAsset *a2 = [[AVURLAsset alloc] init];
              CMTime d = [[[a2 tracksWithMediaType:AVMediaTypeVideo] firstObject] duration];
              AVAssetExportSession *s = [[AVAssetExportSession alloc] initWithAsset:c outputFileType:AVFileTypeMPEG4];
              (void)vt; (void)in; (void)a; (void)d; (void)s;
          }
          EOF
          clang -x objective-c -fsyntax-only -fmodules -sdk "$SDK" -target arm64-apple-ios16.0 /tmp/t.m 2>&1 | head -30             && echo "OBJC PASS" || echo "OBJC FAIL"
          echo "=== 再试其它已装 Xcode 的 device SDK ==="
          ls -d /Applications/Xcode_*.app 2>/dev/null
          for X in 16.3 16.2 16.1 15.4; do
            P="/Applications/Xcode_$X.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
            [ -d "$P" ] && { echo "-- $X"; ls "$P"; }
          done
          echo "=== 结束 ==="

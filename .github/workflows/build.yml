name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        continue-on-error: true
        with:
          xcode-version: '16.4'
      - name: Diagnose SDK API
        run: |
          echo "### 版本"
          xcode-select -p
          xcodebuild -version
          xcrun swiftc -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "### SDK=$SDK"
          ls -d "$SDK" || echo "SDK PATH 不存在!"
          echo "### AVFoundation 头文件是否有 videoTracks / duration"
          H="$SDK/System/Library/Frameworks/AVFoundation.framework/Headers"
          ls "$H" 2>/dev/null | head -8
          grep -n "videoTracks" "$H/AVComposition.h" | head -5
          grep -n "addMutableTrackWithMediaType" "$H/AVComposition.h" | head -8
          grep -n "duration" "$H/AVAssetTrack.h" | head -5
          grep -n "outputFileType" "$H/AVAssetExportSession.h" | head -8
          grep -rn "AVMutableAudioMixInputTrack" "$H/AVAudioMix.h" | head -3
          echo "### Swift overlay 是否存在"
          ls "$SDK/usr/lib/swift/iphoneos" 2>/dev/null | grep -i avfoundation || echo "NO AVFoundation swiftmodule"
          ls "$SDK/usr/lib/swift-5.0/iphoneos" 2>/dev/null | grep -i avfoundation || echo "NO swift-5.0 overlay"
          echo "### probe 完整输出（head 60）"
          cat > /tmp/probe.swift <<'EOF'
          import AVFoundation
          import CoreImage
          import CoreMedia
          let c = AVMutableComposition()
          _ = c.videoTracks
          let m = AVMutableAudioMix()
          _ = m.inputs
          _ = AVMutableAudioMixInputTrack.self
          _ = CMTime.zero
          _ = AVFileType.mp4
          _ = AVMutableVideoComposition().hasAudio
          _ = AVVideoCompositionLayerInstruction.self
          _ = kCIInputImageKey
          let a = AVURLAsset(url: URL(fileURLWithPath: "/tmp/x.mp4"))
          if let s = a.tracks(withMediaType: AVMediaType.video).first {
              _ = s.duration
              _ = s.naturalSize
          }
          if let s = try? AVAssetExportSession(asset: c, outputFileType: AVFileType.mp4) { _ = s }
          let w = URLSession.shared.webSocketTask(with: URL(string: "wss://x")!)
          func rr(_ m: URLSessionWebSocketTask.Message) {
              if case .close = m { print("close") }
          }
          _ = rr
          _ = w
          EOF
          xcrun swiftc -typecheck -module-cache-path /tmp/mc -sdk "$SDK" -target arm64-apple-ios16.0 /tmp/probe.swift 2>&1 | head -60
          echo "### 探针退出码: ${PIPESTATUS[0]}"
          echo "### 对比：不带 -sdk（默认 macOS SDK）"
          cat > /tmp/probe2.swift <<'EOF'
          import AVFoundation
          let c = AVMutableComposition()
          _ = c.videoTracks
          _ = AVMutableAudioMixInputTrack.self
          let a = AVURLAsset(url: URL(fileURLWithPath: "/tmp/x.mp4"))
          if let s = a.tracks(withMediaType: AVMediaType.video).first { _ = s.duration }
          EOF
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk macosx --show-sdk-path)" /tmp/probe2.swift 2>&1 | head -20
          echo "### 对比：iOS Simulator SDK"
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target x86_64-apple-ios16.0-simulator /tmp/probe2.swift 2>&1 | head -20
          echo "### 诊断完成（本 job 不构建）"

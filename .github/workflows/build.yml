name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Guard (防假成功)
        run: |
          SW=$(grep -c '\.swift' MoneyPrinterTurbo.xcodeproj/project.pbxproj || true)
          echo "swift refs: $SW"
          [ "$SW" -ge 12 ] || { echo "::error::Swift 源文件未进工程 ($SW)"; exit 1; }
      - name: Archive
        run: |
          xcodebuild -project MoneyPrinterTurbo.xcodeproj -scheme MoneyPrinterTurbo \
            -configuration Release -archivePath build/MoneyPrinterTurbo.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > build.log 2>&1 || true
          echo "===== xcodebuild error/warning 摘要 ====="
          grep -nE "error:|warning: [^ ]+\.swift" build.log | head -60
          echo "===== 尾部 30 行 ====="; tail -30 build.log
          [ -d build/MoneyPrinterTurbo.xcarchive ] || { echo "::error::BUILD FAILED（无 xcarchive）"; exit 1; }
      - name: Export IPA (无证书 → Payload zip)
        run: |
          mkdir -p build/Payload
          APP=build/MoneyPrinterTurbo.xcarchive/Products/Applications/MoneyPrinterTurbo.app
          [ -d "$APP" ] || APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'MoneyPrinterTurbo.app' -path '*iphoneos*' | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then echo "::error::未找到 .app"; exit 1; fi
          echo "app: $APP"
          cp -R "$APP" build/Payload/
          (cd build && zip -qry MoneyPrinterTurbo-unsigned.ipa Payload)
          du -h build/MoneyPrinterTurbo-unsigned.ipa
      - name: Verify
        run: |
          python3 - << 'PY'
          import zipfile, plistlib
          z = zipfile.ZipFile('build/MoneyPrinterTurbo-unsigned.ipa')
          names = z.namelist()
          ppath = next(n for n in names if n.endswith('.app/Info.plist'))
          p = plistlib.loads(z.read(ppath))
          print('ipa files:', len(names))
          print('version:', p['CFBundleShortVersionString'], p['CFBundleVersion'])
          print('bundle:', p['CFBundleIdentifier'])
          print('display:', p['CFBundleDisplayName'])
          print('assets.car:', any('Assets.car' in n for n in names))
          print('fonts:', sorted(n for n in names if n.endswith('.ttf')))
          print('bgm:', [n for n in names if n.endswith('.mp3')])
          print('voices:', any('azure_voices.json' in n for n in names))
          missing = [k for k in ('CFBundleShortVersionString','CFBundleIdentifier','CFBundleDisplayName') if k not in p]
          assert not missing, 'Info.plist missing: %s' % missing
          PY
          strings -a build/MoneyPrinterTurbo-unsigned.ipa | grep -q "MoneyPrinterTurbo" || { echo "::error::缺特征串"; exit 1; }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterTurbo-unsigned-ipa
          path: build/MoneyPrinterTurbo-unsigned.ipa
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" build/MoneyPrinterTurbo-unsigned.ipa --clobber

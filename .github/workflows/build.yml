name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: SDK health check (真机 SDK 是否被裁)
        run: |
          xcodebuild -version
          xcrun swiftc -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          H="$SDK/System/Library/Frameworks/AVFoundation.framework/Headers"
          for pat in "videoTracks" "addMutableTrackWithMediaType:fromTrack:atTime:" "@property.*CMTime duration"; do
            if grep -q "$pat" "$H/AVComposition.h" "$H/AVAssetTrack.h" 2>/dev/null; then
              echo "OK  $pat"
            else
              echo "MISSING  $pat"
            fi
          done
          cat > /tmp/probe.swift <<'EOF'
          import AVFoundation
          import CoreMedia
          let c = AVMutableComposition()
          _ = c.videoTracks
          _ = AVMutableAudioMix().inputs
          _ = AVMutableAudioMixInputTrack.self
          _ = AVMutableVideoComposition().hasAudio
          _ = AVVideoCompositionLayerInstruction.self
          _ = AVFileType.mp4
          _ = CMTime.zero
          let a = AVURLAsset(url: URL(fileURLWithPath: "/tmp/x.mp4"))
          if let s = a.tracks(withMediaType: AVMediaType.video).first {
              _ = s.duration
              _ = s.naturalSize
          }
          if let s = try? AVAssetExportSession(asset: c, outputFileType: AVFileType.mp4) { _ = s }
          EOF
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0 /tmp/probe.swift             && echo "PROBE PASS" || echo "PROBE FAIL(见上)"

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install --quiet xcodegen; fi
          xcodegen version

      - name: Generate project
        run: xcodegen generate

      - name: Guard (防假成功)
        run: |
          SW=$(grep -c '\.swift' MoneyPrinterTurbo.xcodeproj/project.pbxproj || true)
          echo "swift refs: $SW"
          [ "$SW" -ge 12 ] || { echo "::error::Swift 源文件未进工程 ($SW)"; exit 1; }

      - name: Archive
        run: |
          xcodebuild -project MoneyPrinterTurbo.xcodeproj -scheme MoneyPrinterTurbo             -configuration Release -archivePath build/MoneyPrinterTurbo.xcarchive             CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""             archive > build.log 2>&1 || true
          echo "=== error 摘要 ==="
          grep -nE "error:" build.log | head -80
          echo "=== 退出判定 ==="
          grep -q "ARCHIVE SUCCEEDED" build.log || { tail -30 build.log; exit 1; }

      - name: Export IPA (无证书 → Payload zip)
        run: |
          APP=build/MoneyPrinterTurbo.xcarchive/Products/Applications/MoneyPrinterTurbo.app
          [ -d "$APP" ] || { echo "no .app"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry MoneyPrinterTurbo-unsigned.ipa Payload && cd ..
          ls -l build/MoneyPrinterTurbo-unsigned.ipa

      - name: Verify
        run: |
          python3 - <<'PY'
          import zipfile, plistlib, hashlib, os
          p = "build/MoneyPrinterTurbo-unsigned.ipa"
          z = zipfile.ZipFile(p)
          names = z.namelist()
          ipa = os.path.getsize(p)
          plist = None
          for n in names:
              if n.endswith("Info.plist") and "Frameworks" not in n:
                  try: plist = plistlib.loads(z.read(n))
                  except Exception: pass
          md5 = hashlib.md5(open(p, "rb").read()).hexdigest()
          print("ipa_bytes:", ipa, "md5:", md5)
          print("version:", plist.get("CFBundleShortVersionString"), plist.get("CFBundleVersion"))
          print("id:", plist.get("CFBundleIdentifier"), plist.get("CFBundleDisplayName"))
          for key in ("Assets.car", "BeVietnamPro-Bold.ttf", "azure_voices.json", "output000.mp3"):
              print(key, "->", any(key in n for n in names))
          assert ipa > 500_000, "IPA 过小"
          assert plist and plist.get("CFBundleShortVersionString") == "1.1.0", "版本不符"
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/MoneyPrinterTurbo-unsigned.ipa --clobber

name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        continue-on-error: true
        with:
          xcode-version: '16.4'

      - name: AVFoundation 头文件速查
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          H="$SDK/System/Library/Frameworks/AVFoundation.framework/Headers"
          echo "--- AVAsset.h duration ---"; grep -n "CMTime duration" "$H/AVAsset.h" | head -3
          echo "--- insertTimeRange ---"; grep -rn "insertTimeRange:" "$H" | head -4
          echo "--- layerInstruction 构造 ---"; grep -rn "videoCompositionLayerInstructionWithAssetTrack\|initWithAssetTrack" "$H" | head -4
          echo "--- videoCompositionInstruction 工厂 ---"; grep -rn "videoCompositionInstruction" "$H" | head -4
          echo "--- layerInstructions ---"; grep -rn "layerInstructions" "$H" | head -4
          echo "--- AVMutableAudioMixInputTrack ---"; grep -rn "AVMutableAudioMixInputTrack" "$H" | head -4
          echo "--- AVAudioMix.h inputs ---"; grep -rn "inputs\|inputParameters" "$H/AVAudioMix.h" | head -6
          echo "--- AVAssetExportSession 初始化 ---"; grep -n "initWithAsset\|outputFileType\|exportAsynchronously" "$H/AVAssetExportSession.h" | head -8
          echo "--- AVVideoComposition 属性 ---"; grep -n "renderSize\|frameDuration\|instructions" "$H/AVVideoComposition.h" | head -6

      - name: Install xcodegen
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install --quiet xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate

      - name: Guard (防假成功)
        run: |
          SW=$(grep -c '\.swift' MoneyPrinterTurbo.xcodeproj/project.pbxproj || true)
          MM=$(grep -c '\.m in Sources' MoneyPrinterTurbo.xcodeproj/project.pbxproj || true)
          echo "swift refs: $SW / objc m refs: $MM"
          [ "$SW" -ge 12 ] || { echo "::error::Swift 源文件未进工程"; exit 1; }
          [ "$MM" -ge 1 ] || { echo "::error::ObjC 桥未进工程"; exit 1; }
          grep -q "MPT-Bridging-Header.h" MoneyPrinterTurbo.xcodeproj/project.pbxproj \
            || grep -q "SWIFT_OBJC_BRIDGING_HEADER" MoneyPrinterTurbo.xcodeproj/project.pbxproj \
            || { echo "::error::桥接头未配置"; exit 1; }

      - name: Archive
        run: |
          xcodebuild -project MoneyPrinterTurbo.xcodeproj -scheme MoneyPrinterTurbo \
            -configuration Release -archivePath build/MoneyPrinterTurbo.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            archive > build.log 2>&1 || true
          echo "=== errors ==="
          grep -nE "error:" build.log | head -60
          grep -q "ARCHIVE SUCCEEDED" build.log || { echo "::error::BUILD FAILED"; tail -25 build.log; exit 1; }

      - name: Export IPA (无证书 → Payload zip)
        run: |
          APP=build/MoneyPrinterTurbo.xcarchive/Products/Applications/MoneyPrinterTurbo.app
          [ -d "$APP" ] || { echo "no .app"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry MoneyPrinterTurbo-unsigned.ipa Payload && cd ..
          ls -l build/MoneyPrinterTurbo-unsigned.ipa

      - name: Verify
        run: |
          python3 - <<'PY'
          import zipfile, plistlib, hashlib, os
          p = "build/MoneyPrinterTurbo-unsigned.ipa"
          z = zipfile.ZipFile(p)
          names = z.namelist()
          plist = None
          for n in names:
              if n.endswith("Info.plist") and "Frameworks" not in n:
                  try: plist = plistlib.loads(z.read(n))
                  except Exception: pass
          md5 = hashlib.md5(open(p, "rb").read()).hexdigest()
          print("ipa_bytes:", os.path.getsize(p), "md5:", md5)
          print("version:", plist.get("CFBundleShortVersionString"), plist.get("CFBundleVersion"))
          print("id:", plist.get("CFBundleIdentifier"), plist.get("CFBundleDisplayName"))
          for key in ("Assets.car", "BeVietnamPro-Bold.ttf", "azure_voices.json", "output000.mp3"):
              print(key, "->", any(key in n for n in names))
          assert plist is not None and plist.get("CFBundleShortVersionString") == "1.1.0"
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterTurbo-unsigned-ipa
          path: build/MoneyPrinterTurbo-unsigned.ipa

      - name: Publish release (公网直链)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: MoneyPrinterTurbo iOS v1.1.0 (P2 出片流水线)
          body: |
            P2：文案→关键词→素材检索(Pexels/Pixabay/Coverr)→TTS→字幕烧录→AVFoundation 合成 MP4
            界面改为竖版单列布局；任务页可播放/分享成片。
          files: build/MoneyPrinterTurbo-unsigned.ipa
          fail_on_unmatched_files: false

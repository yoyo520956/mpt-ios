name: MoneyPrinterTurbo
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1.0.0(20261023.01)"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  MoneyPrinterTurbo:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/BGM
        buildPhase: resources
      - path: Resources/azure_voices.json
        buildPhase: resources
    scripts:
      - name: CopyExtraResources
        script: |
          DEST="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}/Resources"
          mkdir -p "$DEST"
          cp -R Resources/Fonts "$DEST/" 2>/dev/null || true
          cp -R Resources/BGM "$DEST/" 2>/dev/null || true
          cp Resources/azure_voices.json "$DEST/" 2>/dev/null || true
          echo "extra resources:"; find "$DEST" -type f | head -20
        deps: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.moneyprinterturbo
        PRODUCT_NAME: MoneyPrinterTurbo
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: minimal
